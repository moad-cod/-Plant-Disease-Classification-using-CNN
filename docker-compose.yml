services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api
    environment:
      - VITE_API_BASE_URL=http://127.0.0.1:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
